prometheus:
  prometheusSpec:
    retention: 7d

    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

    storageSpec:
      emptyDir:
        sizeLimit: 5Gi

  additionalServiceMonitors:
    - name: traefik
      selector:
        matchLabels:
          app.kubernetes.io/name: traefik
          app.kubernetes.io/component: metrics

      namespaceSelector:
        matchNames:
          - traefik

      endpoints:
        - port: metrics
          path: /metrics
          interval: 30s

prometheusOperator:
  enabled: true

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true

kube-state-metrics:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

grafana:
  enabled: true

  service:
    type: ClusterIP
    port: 80

  persistence:
    enabled: true
    type: pvc
    storageClassName: gp3
    accessModes:
      - ReadWriteOnce
    size: 5Gi

  ingress:
    enabled: true
    ingressClassName: traefik

    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt"
      # traefik.ingress.kubernetes.io/router.middlewares: "monitoring-grafana-ip-allowlist@kubernetescrd"
      # Uncomment the line above to enable IP allowlist for Grafana ingress.

    hosts:
      - grafana.eks.humdaan.co.uk

    path: /
    pathType: Prefix

    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.eks.humdaan.co.uk

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi

  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password

  envFromSecret: grafana-oauth-credentials

  grafana.ini:
    server:
      root_url: https://grafana.eks.humdaan.co.uk

    auth.anonymous:
      enabled: false

    users:
      allow_sign_up: false

    auth.github:
      enabled: true
      allow_sign_up: true
      scopes: "user:email,read:org"

      role_attribute_path: "[login=='rafiquehumdaan-alt'][0] && 'Admin' || 'None'"
      role_attribute_strict: true
      allow_assign_grafana_admin: false
