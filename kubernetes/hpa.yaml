apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: 2048-hpa
  namespace: "2048"

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: 2048-deployment

  minReplicas: 2
  maxReplicas: 4

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
