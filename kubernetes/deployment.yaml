apiVersion: apps/v1
kind: Deployment

metadata:
  name: "2048-deployment"
  namespace: "2048"

spec:
  selector:
    matchLabels:
      app: "2048"

  template:
    metadata:
      labels:
        app: "2048"

    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          minDomains: 2
          labelSelector:
            matchLabels:
              app: "2048"

      containers:
        - name: "2048"
          image: "435059220418.dkr.ecr.eu-west-2.amazonaws.com/2048-eks-repo:155475a36864452e2c35605a128510fcbe3339c9"

          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80

          livenessProbe:
            httpGet:
              path: /
              port: 80

          startupProbe:
            httpGet:
              path: /
              port: 80

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"

            limits:
              cpu: "200m"
              memory: "128Mi"
