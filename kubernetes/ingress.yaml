apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: 2048-ingress
  namespace: "2048"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx

  tls:
    - hosts:
        - eks.humdaan.co.uk
      secretName: 2048-tls

  rules:
    - host: eks.humdaan.co.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: 2048-cluster-ip-service
                port:
                  number: 80