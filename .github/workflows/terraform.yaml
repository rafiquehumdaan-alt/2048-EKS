name: Terraform Workflow

on:
    push:
        branches:
            - main
        paths:
            - "terraform/**"

    pull_request:
        branches:
            - main
        paths:
            - "terraform/**"

    workflow_dispatch:
        inputs:
            action:
                description: "Choose the Terraform action to perform"
                required: true
                type: choice
                options:
                    - plan
                    - apply
                    - destroy

permissions:
    contents: read
    id-token: write

jobs:
    terraform-checks:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: terraform

        env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Terraform
              uses: hashicorp/setup-terraform@v3

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ vars.AWS_ROLE_ARN }}
                  aws-region: eu-west-2

            - name: Terraform format
              run: terraform fmt -check -recursive

            - name: Terraform init
              run: terraform init

            - name: Terraform validate
              run: terraform validate

            - name: Terraform plan
              if: github.event_name != 'workflow_dispatch' || github.event.inputs.action == 'plan'
              run: terraform plan

    terraform-apply:
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
        needs: terraform-checks
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: terraform

        env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Terraform
              uses: hashicorp/setup-terraform@v3

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ vars.AWS_ROLE_ARN }}
                  aws-region: eu-west-2

            - name: Terraform init
              run: terraform init

            - name: Terraform plan
              run: terraform plan -out=tfplan

            - name: Terraform apply
              run: terraform apply -auto-approve tfplan

    terraform-destroy:
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        needs: terraform-checks
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: terraform

        env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Terraform
              uses: hashicorp/setup-terraform@v3

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ vars.AWS_ROLE_ARN }}
                  aws-region: eu-west-2

            - name: Set up kubectl
              uses: azure/setup-kubectl@v4

            - name: Set up Helm
              uses: azure/setup-helm@v4

            - name: Terraform init
              run: terraform init

            - name: Configure kubectl
              run: |
                aws eks update-kubeconfig --name 2048-eks-cluster --region eu-west-2
            
            - name: Remove ingress-nginx Helm release
              run: |
                helm uninstall ingress-nginx -n ingress-nginx --ignore-not-found --wait --timeout 300s

            - name: Wait for ingress-nginx load balancer cleanup
              run: |
                sleep 60s

            - name: Remove aws-load-balancer-controller Helm release
              run: |
                helm uninstall aws-load-balancer-controller -n kube-system --ignore-not-found --wait --timeout 300s

            - name: Remove leftover Kubernetes security groups
              run: |
                VPC_ID=$(terraform output -raw vpc_id)

                for attempt in {1..10}; do
                  SG_IDS=$(aws ec2 describe-security-groups \
                    --filters \
                      "Name=vpc-id,Values=$VPC_ID" \
                      "Name=group-name,Values=k8s-*" \
                    --query "SecurityGroups[*].GroupId" \
                    --output text)

                  if [ -z "$SG_IDS" ]; then
                    echo "No leftover Kubernetes security groups found."
                    exit 0
                  fi

                  echo "Found Kubernetes security groups: $SG_IDS"

                  for SG_ID in $SG_IDS; do
                    ENI_COUNT=$(aws ec2 describe-network-interfaces \
                      --filters "Name=group-id,Values=$SG_ID" \
                      --query "length(NetworkInterfaces)" \
                      --output text)

                    if [ "$ENI_COUNT" -eq 0 ]; then
                      echo "Deleting security group: $SG_ID"
                      aws ec2 delete-security-group --group-id "$SG_ID" || true
                    else
                      echo "$SG_ID is still attached to $ENI_COUNT network interface(s)."
                    fi
                  done

                  echo "Waiting 30 seconds before checking again..."
                  sleep 30
                done

                echo "Some Kubernetes security groups still remain after waiting."
                exit 1

            - name: Terraform plan for destroy
              run: terraform plan -destroy -out=destroy.tfplan

            - name: Terraform destroy
              run: terraform apply -auto-approve destroy.tfplan
