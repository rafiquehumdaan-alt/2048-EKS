name: Terraform Workflow

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - "kubernetes/**"
      - "argocd/**"

  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - "kubernetes/**"
      - "argocd/**"

  workflow_dispatch:
    inputs:
      action:
        description: "Choose the Terraform action to perform"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
  id-token: write

jobs:
  terraform-checks:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkov Terraform Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          soft_fail: true

      - name: Checkov Kubernetes Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: kubernetes
          framework: kubernetes
          soft_fail: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Terraform format
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.action == 'plan'
        run: terraform plan

  terraform-apply:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
    needs: terraform-checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name 2048-eks-cluster \
            --region eu-west-2

      - name: Verify EKS access
        run: |
          kubectl get nodes

      - name: Create Grafana Kubernetes Secrets
        env:
          GRAFANA_GITHUB_CLIENT_ID: ${{ secrets.GRAFANA_GITHUB_CLIENT_ID }}
          GRAFANA_GITHUB_CLIENT_SECRET: ${{ secrets.GRAFANA_GITHUB_CLIENT_SECRET }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          for name in GRAFANA_GITHUB_CLIENT_ID GRAFANA_GITHUB_CLIENT_SECRET GRAFANA_ADMIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name"
              exit 1
            fi
          done

          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -


          python3 - <<'PY' | kubectl apply --server-side --field-manager=grafana-secret-bootstrap -f -
          import base64
          import json
          import os

          def encode(value):
              return base64.b64encode(value.encode()).decode()

          secrets = [
              {
                  "apiVersion": "v1",
                  "kind": "Secret",
                  "metadata": {
                      "name": "grafana-oauth-credentials",
                      "namespace": "monitoring"
                  },
                  "type": "Opaque",
                  "data": {
                      "GF_AUTH_GITHUB_CLIENT_ID": encode(os.environ["GRAFANA_GITHUB_CLIENT_ID"]),
                      "GF_AUTH_GITHUB_CLIENT_SECRET": encode(os.environ["GRAFANA_GITHUB_CLIENT_SECRET"])
                  }
              },
              {
                  "apiVersion": "v1",
                  "kind": "Secret",
                  "metadata": {
                      "name": "grafana-admin-credentials",
                      "namespace": "monitoring"
                  },
                  "type": "Opaque",
                  "data": {
                      "admin-user": encode("admin"),
                      "admin-password": encode(os.environ["GRAFANA_ADMIN_PASSWORD"])
                  }
              }
          ]

          print(json.dumps({
              "apiVersion": "v1",
              "kind": "List",
              "items": secrets
          }))
          PY

      - name: Add ArgoCD Helm repository
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update

      - name: Install ArgoCD
        run: |
          helm upgrade --install argocd argo/argo-cd --namespace argocd --create-namespace --values ../argocd/values.yaml --wait --timeout 10m

      - name: Verify ArgoCD installation
        run: |
          kubectl rollout status statefulset/argocd-application-controller -n argocd --timeout=300s
          kubectl rollout status deployment/argocd-repo-server -n argocd --timeout=300s
          kubectl rollout status deployment/argocd-server -n argocd --timeout=300s
          kubectl rollout status deployment/argocd-applicationset-controller -n argocd --timeout=300s
          echo "ArgoCD pods:"
          kubectl get pods -n argocd
          echo "ArgoCD Helm release:"
          helm list -n argocd

      - name: Register AWS Load Balancer Controller Application
        run: |
          VPC_ID=$(terraform output -raw vpc_id)
            
          sed "s/__VPC_ID__/$VPC_ID/g" ../argocd/applications/aws-load-balancer-controller.yaml > /tmp/aws-load-balancer-controller.yaml
          kubectl apply -f /tmp/aws-load-balancer-controller.yaml

      - name: Register cert-manager Application
        run: |
          kubectl apply -f ../argocd/applications/cert-manager.yaml

      - name: Wait for cert-manager
        run: |
          kubectl wait --for=jsonpath='{.status.health.status}'=Healthy application/cert-manager -n argocd --timeout=600s

      - name: Register cluster-issuer Application
        run: |
          kubectl apply -f ../argocd/applications/cluster-issuer.yaml

      - name: Wait for AWS Load Balancer Controller
        run: |
          kubectl wait --for=jsonpath='{.status.health.status}'=Healthy application/aws-load-balancer-controller -n argocd --timeout=600s

      - name: Register ingress-nginx Application
        run: |
          kubectl apply -f ../argocd/applications/ingress-nginx.yaml

      - name: Register ExternalDNS Application
        run: |
          kubectl apply -f ../argocd/applications/external-dns.yaml

      - name: Verify Platform Controllers
        run: |
          set -euo pipefail

          for APP in \
            aws-load-balancer-controller \
            cert-manager \
            cluster-issuer \
            ingress-nginx \
            external-dns; do

            echo "Waiting for $APP..."

            kubectl wait \
              --for=jsonpath='{.status.sync.status}'=Synced \
              "application/$APP" \
              -n argocd \
              --timeout=600s

            kubectl wait \
              --for=jsonpath='{.status.health.status}'=Healthy \
              "application/$APP" \
              -n argocd \
              --timeout=600s

            echo "$APP is ready."
          done

          echo "All platform controllers are ready."

      - name: Register 2048 Application
        run: |
          kubectl apply -f ../argocd/applications/2048.yaml

      - name: Register Monitoring Application
        run: |
          kubectl apply -f ../argocd/applications/monitoring.yaml

      - name: Verify Prometheus Operator
        run: |
          echo "Waiting for Prometheus CRDs to be established..."

          for CRD in prometheuses.monitoring.coreos.com alertmanagers.monitoring.coreos.com servicemonitors.monitoring.coreos.com podmonitors.monitoring.coreos.com; do
            kubectl wait --for=create crd/"$CRD" --timeout=600s
            kubectl wait --for=condition=established crd/"$CRD" --timeout=600s
          done

          echo "Waiting for Prometheus Operator deployment"
          kubectl wait --for=create deployment/monitoring-kube-prometheus-operator -n monitoring --timeout=600s
          kubectl rollout status deployment/monitoring-kube-prometheus-operator -n monitoring --timeout=300s
          echo "Restarting Prometheus Operator after CRDs are established..."
          kubectl rollout restart deployment/monitoring-kube-prometheus-operator -n monitoring
          kubectl rollout status deployment/monitoring-kube-prometheus-operator -n monitoring --timeout=300s
          echo "Prometheus Operator is ready."

      - name: Verify ArgoCD Platform Applications
        run: |
          set -euo pipefail

          APPS=(
            aws-load-balancer-controller
            cert-manager
            cluster-issuer
            ingress-nginx
            external-dns
            monitoring
          )

          for APP in "${APPS[@]}"; do
            echo "========== Checking $APP =========="

            if ! kubectl wait \
              --for=jsonpath='{.status.sync.status}'=Synced \
              "application/$APP" \
              -n argocd \
              --timeout=600s; then

              echo "::error::$APP failed to become Synced."
              kubectl describe application "$APP" -n argocd || true
              exit 1
            fi

            if ! kubectl wait \
              --for=jsonpath='{.status.health.status}'=Healthy \
              "application/$APP" \
              -n argocd \
              --timeout=600s; then

              echo "::error::$APP failed to become Healthy."

              kubectl describe application "$APP" -n argocd || true

              echo "Application resources:"
              kubectl get pods,deployments,statefulsets,services \
                -n monitoring || true

              echo "Recent Kubernetes events:"
              kubectl get events -A \
                --sort-by=.lastTimestamp | tail -40 || true

              exit 1
            fi

            echo "$APP is Synced and Healthy."
          done

          echo "All ArgoCD Applications are healthy."

  terraform-destroy:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
    needs: terraform-checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Terraform init
        run: terraform init

      - name: Check if EKS cluster exists
        id: eks-check
        run: |
          if aws eks describe-cluster \
            --name 2048-eks-cluster \
            --region eu-west-2 >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "EKS cluster exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "EKS cluster does not exist. Skipping Kubernetes cleanup."
          fi

      - name: Configure kubectl
        if: steps.eks-check.outputs.exists == 'true'
        run: |
          aws eks update-kubeconfig \
            --name 2048-eks-cluster \
            --region eu-west-2

      - name: Ensure GitHub Actions EKS access
        if: steps.eks-check.outputs.exists == 'true'
        run: |
          if ! aws eks describe-access-entry \
            --cluster-name 2048-eks-cluster \
            --principal-arn "${{ vars.AWS_ROLE_ARN }}" \
            --region eu-west-2 >/dev/null 2>&1; then

            echo "GitHub Actions EKS access entry is missing. Recreating it..."

            aws eks create-access-entry \
              --cluster-name 2048-eks-cluster \
              --principal-arn "${{ vars.AWS_ROLE_ARN }}" \
              --type STANDARD \
              --region eu-west-2

            aws eks associate-access-policy \
              --cluster-name 2048-eks-cluster \
              --principal-arn "${{ vars.AWS_ROLE_ARN }}" \
              --policy-arn arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy \
              --access-scope type=cluster \
              --region eu-west-2

            echo "Waiting for EKS access to propagate..."
            sleep 15
          else
            echo "GitHub Actions EKS access already exists."
          fi

      - name: Check if ArgoCD is installed
        id: argocd-check
        if: steps.eks-check.outputs.exists == 'true'
        run: |
          if kubectl get crd applications.argoproj.io >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove Monitoring Application
        if: steps.argocd-check.outputs.exists == 'true'
        run: |
          if kubectl get application monitoring -n argocd >/dev/null 2>&1; then
            kubectl patch application monitoring -n argocd \
              --type merge \
              -p '{"metadata":{"finalizers":["resources-finalizer.argocd.argoproj.io"]}}'

            kubectl delete application monitoring -n argocd --wait=false

            kubectl wait --for=delete application/monitoring \
              -n argocd --timeout=600s
          fi

      - name: Remove 2048 Application
        if: steps.argocd-check.outputs.exists == 'true'
        run: |
          if kubectl get application 2048 -n argocd >/dev/null 2>&1; then
            kubectl patch application 2048 -n argocd --type merge -p '{"metadata":{"finalizers":["resources-finalizer.argocd.argoproj.io"]}}'
            kubectl delete application 2048 -n argocd --wait=false
          fi

          for attempt in {1..60}; do
            APP=$(kubectl get application 2048 -n argocd --ignore-not-found -o name) || {
            echo "Failed to connect to Kubernetes API"
            exit 1
            }

            if [ -z "$APP" ]; then
              echo "Application 2048 deleted."
              exit 0
            fi

            STUCK_CHALLENGES=$(kubectl get challenges -n 2048 -o json | jq -r '
              .items[]
              | select(.metadata.deletionTimestamp != null)
              | select((.status.reason // "") | contains("NoSuchHostedZone"))
              | .metadata.name
            ')

            for CHALLENGE in $STUCK_CHALLENGES; do
              echo "Removing obsolete finalizer from $CHALLENGE"

              kubectl patch challenge "$CHALLENGE" -n 2048 \
                --type=merge \
                -p '{"metadata":{"finalizers":[]}}'
            done

            sleep 10
          done

          echo "2048 Application deletion timed out."
          kubectl get challenges,orders,certificates,ingress -n 2048
          exit 1

      - name: Remove ingress-nginx Application
        if: steps.argocd-check.outputs.exists == 'true'
        run: |
          if kubectl get application ingress-nginx -n argocd >/dev/null 2>&1; then
            kubectl patch application ingress-nginx -n argocd \
              --type merge \
              -p '{"metadata":{"finalizers":["resources-finalizer.argocd.argoproj.io"]}}'

            kubectl delete application ingress-nginx -n argocd --wait=false

            kubectl wait --for=delete application/ingress-nginx \
              -n argocd --timeout=600s
          fi

      - name: Wait for NLB deletion
        if: steps.eks-check.outputs.exists == 'true'
        run: |
          VPC_ID=$(terraform output -raw vpc_id)

          for attempt in {1..20}; do
            NLB_COUNT=$(aws elbv2 describe-load-balancers \
              --region eu-west-2 \
              --query "length(LoadBalancers[?Type=='network' && VpcId=='$VPC_ID'])" \
              --output text)

            if [ "$NLB_COUNT" -eq 0 ]; then
              echo "All NLBs in the VPC have been deleted."
              exit 0
            fi

            echo "Waiting for $NLB_COUNT NLB(s) to be deleted..."
            sleep 15
          done

          echo "NLB deletion timed out."
          exit 1

      - name: Remove ExternalDNS Application
        if: steps.argocd-check.outputs.exists == 'true'
        run: |
          if kubectl get application external-dns -n argocd >/dev/null 2>&1; then
            kubectl patch application external-dns -n argocd \
              --type merge \
              -p '{"metadata":{"finalizers":["resources-finalizer.argocd.argoproj.io"]}}'

            kubectl delete application external-dns -n argocd --wait=false

            kubectl wait --for=delete application/external-dns \
              -n argocd --timeout=300s
          fi

      - name: Remove ClusterIssuer Application
        if: steps.argocd-check.outputs.exists == 'true'
        run: |
          if kubectl get application cluster-issuer -n argocd >/dev/null 2>&1; then
            kubectl patch application cluster-issuer -n argocd \
              --type merge \
              -p '{"metadata":{"finalizers":["resources-finalizer.argocd.argoproj.io"]}}'

            kubectl delete application cluster-issuer -n argocd --wait=false

            kubectl wait --for=delete application/cluster-issuer \
              -n argocd --timeout=300s
          fi

      - name: Remove AWS Load Balancer Controller and cert-manager
        if: steps.argocd-check.outputs.exists == 'true'
        run: |
          for APP in aws-load-balancer-controller cert-manager; do
            if kubectl get application "$APP" -n argocd >/dev/null 2>&1; then
              kubectl patch application "$APP" -n argocd \
                --type merge \
                -p '{"metadata":{"finalizers":["resources-finalizer.argocd.argoproj.io"]}}'

              kubectl delete application "$APP" -n argocd --wait=false

              kubectl wait --for=delete application/"$APP" \
                -n argocd --timeout=300s
            fi
          done

      - name: Remove ArgoCD Helm release
        if: steps.eks-check.outputs.exists == 'true'
        run: |
          helm uninstall argocd \
            -n argocd \
            --ignore-not-found \
            --wait \
            --timeout 300s

      - name: Remove ArgoCD namespace
        if: steps.eks-check.outputs.exists == 'true'
        run: |
          kubectl delete namespace argocd --ignore-not-found=true --wait=true --timeout=300s

      - name: Remove leftover Kubernetes security groups
        run: |
          VPC_ID=$(terraform output -raw vpc_id 2>/dev/null || true)

          if [ -z "$VPC_ID" ]; then
            echo "Terraform VPC output unavailable. Trying EKS cluster..."

            VPC_ID=$(aws eks describe-cluster \
              --name 2048-eks-cluster \
              --region eu-west-2 \
              --query "cluster.resourcesVpcConfig.vpcId" \
              --output text 2>/dev/null || true)
          fi

          if [ -z "$VPC_ID" ] || [ "$VPC_ID" = "None" ]; then
            echo "Could not determine VPC ID. Skipping Kubernetes security group cleanup."
            exit 0
          fi

          echo "Using VPC: $VPC_ID"

          for attempt in {1..10}; do
            SG_IDS=$(aws ec2 describe-security-groups \
              --filters \
                "Name=vpc-id,Values=$VPC_ID" \
                "Name=group-name,Values=k8s-*" \
              --query "SecurityGroups[*].GroupId" \
              --output text)

            if [ -z "$SG_IDS" ]; then
              echo "No leftover Kubernetes security groups found."
              exit 0
            fi

            echo "Found Kubernetes security groups: $SG_IDS"

            for SG_ID in $SG_IDS; do
              ENI_COUNT=$(aws ec2 describe-network-interfaces \
                --filters "Name=group-id,Values=$SG_ID" \
                --query "length(NetworkInterfaces)" \
                --output text)

              if [ "$ENI_COUNT" -eq 0 ]; then
                echo "Deleting security group: $SG_ID"
                aws ec2 delete-security-group \
                  --group-id "$SG_ID" || true
              else
                echo "$SG_ID is still attached to $ENI_COUNT network interface(s)."
              fi
            done

            echo "Waiting 30 seconds before checking again..."
            sleep 30
          done

          echo "Some Kubernetes security groups still remain after waiting."
          exit 1

      - name: Remove leftover Route 53 records
        run: |
          ZONE_ID=$(terraform output -raw eks_route53_zone_id 2>/dev/null || true)

          if [ -z "$ZONE_ID" ]; then
            echo "No Route 53 zone in Terraform state. Skipping."
            exit 0
          fi

          aws route53 list-resource-record-sets \
            --hosted-zone-id "$ZONE_ID" \
            --output json |
            jq '{
              Changes: [
                .ResourceRecordSets[]
                | select(
                    .Name == "eks.humdaan.co.uk." and
                    (.Type == "A" or .Type == "AAAA")
                  )
                | {Action: "DELETE", ResourceRecordSet: .}
              ]
            }' > /tmp/2048-dns-cleanup.json

          COUNT=$(jq '.Changes | length' /tmp/2048-dns-cleanup.json)

          if [ "$COUNT" -gt 0 ]; then
            CHANGE_ID=$(aws route53 change-resource-record-sets \
              --hosted-zone-id "$ZONE_ID" \
              --change-batch file:///tmp/2048-dns-cleanup.json \
              --query ChangeInfo.Id --output text)

            aws route53 wait resource-record-sets-changed --id "$CHANGE_ID"
          fi

          echo "Route 53 cleanup complete."

      - name: Terraform plan for destroy
        run: terraform plan -destroy -out=destroy.tfplan

      - name: Terraform destroy
        run: |
          if terraform apply -auto-approve destroy.tfplan; then
            exit 0
          fi

          echo "Initial destroy failed. Checking for orphaned Kubernetes ENIs..."

          # Do not clean up ENIs while managed node groups still exist.
          if aws eks describe-cluster \
            --name 2048-eks-cluster --region eu-west-2 \
            >/dev/null 2>&1; then

            NODEGROUPS=$(aws eks list-nodegroups \
              --cluster-name 2048-eks-cluster \
              --region eu-west-2 \
              --query 'length(nodegroups)' --output text)

            if [ "$NODEGROUPS" -ne 0 ]; then
              echo "Node groups still exist. Refusing ENI cleanup."
              exit 1
            fi
          fi

          VPC_ID=$(terraform output -raw vpc_id 2>/dev/null || true)

          if [ -n "$VPC_ID" ]; then
            aws ec2 describe-network-interfaces \
              --region eu-west-2 \
              --filters "Name=vpc-id,Values=$VPC_ID" \
              --output json |
              jq -r '.NetworkInterfaces[]
                | select(
                    .Status == "available" and
                    .RequesterManaged == false and
                    .Attachment == null and
                    (.Description | startswith("aws-K8S-"))
                  )
                | .NetworkInterfaceId' > /tmp/orphaned-enis.txt

            while read -r ENI_ID; do
              [ -z "$ENI_ID" ] && continue
              echo "Deleting orphaned ENI: $ENI_ID"
              aws ec2 delete-network-interface \
                --region eu-west-2 \
                --network-interface-id "$ENI_ID"
            done < /tmp/orphaned-enis.txt
          fi

          echo "Retrying Terraform destroy..."
          terraform plan -destroy -out=retry-destroy.tfplan
          terraform apply -auto-approve retry-destroy.tfplan
