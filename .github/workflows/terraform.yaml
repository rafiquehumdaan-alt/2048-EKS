name: Terraform Workflow

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - "kubernetes/**"
      - "argocd/**"

  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - "kubernetes/**"
      - "argocd/**"

  workflow_dispatch:
    inputs:
      action:
        description: "Choose the Terraform action to perform"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
  id-token: write

jobs:
  terraform-checks:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkov Terraform Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          soft_fail: true

      - name: Checkov Kubernetes Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: kubernetes
          framework: kubernetes
          soft_fail: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Terraform format
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.action == 'plan'
        run: terraform plan

  terraform-apply:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
    needs: terraform-checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name 2048-eks-cluster \
            --region eu-west-2

      - name: Verify EKS access
        run: |
          kubectl get nodes

      - name: Add ArgoCD Helm repository
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update

      - name: Install ArgoCD
        run: |
          helm upgrade --install argocd argo/argo-cd --namespace argocd --create-namespace --values ../argocd/values.yaml --wait --timeout 10m

      - name: Verify ArgoCD installation
        run: |
          kubectl rollout status statefulset/argocd-application-controller -n argocd --timeout=300s
          kubectl rollout status deployment/argocd-repo-server -n argocd --timeout=300s
          kubectl rollout status deployment/argocd-server -n argocd --timeout=300s
          kubectl rollout status deployment/argocd-applicationset-controller -n argocd --timeout=300s
          echo "ArgoCD pods:"
          kubectl get pods -n argocd
          echo "ArgoCD Helm release:"
          helm list -n argocd

  terraform-destroy:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
    needs: terraform-checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Terraform init
        run: terraform init

      - name: Check if EKS cluster exists
        id: eks-check
        run: |
          if aws eks describe-cluster \
            --name 2048-eks-cluster \
            --region eu-west-2 >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "EKS cluster exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "EKS cluster does not exist. Skipping Kubernetes cleanup."
          fi

      - name: Configure kubectl
        if: steps.eks-check.outputs.exists == 'true'
        run: |
          aws eks update-kubeconfig \
            --name 2048-eks-cluster \
            --region eu-west-2

      - name: Ensure GitHub Actions EKS access
        if: steps.eks-check.outputs.exists == 'true'
        run: |
          if ! aws eks describe-access-entry \
            --cluster-name 2048-eks-cluster \
            --principal-arn "${{ vars.AWS_ROLE_ARN }}" \
            --region eu-west-2 >/dev/null 2>&1; then

            echo "GitHub Actions EKS access entry is missing. Recreating it..."

            aws eks create-access-entry \
              --cluster-name 2048-eks-cluster \
              --principal-arn "${{ vars.AWS_ROLE_ARN }}" \
              --type STANDARD \
              --region eu-west-2

            aws eks associate-access-policy \
              --cluster-name 2048-eks-cluster \
              --principal-arn "${{ vars.AWS_ROLE_ARN }}" \
              --policy-arn arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy \
              --access-scope type=cluster \
              --region eu-west-2

            echo "Waiting for EKS access to propagate..."
            sleep 15
          else
            echo "GitHub Actions EKS access already exists."
          fi

      - name: Remove ArgoCD Helm release
        if: steps.eks-check.outputs.exists == 'true'
        run: |
          helm uninstall argocd \
            -n argocd \
            --ignore-not-found \
            --wait \
            --timeout 300s

      - name: Remove ArgoCD namespace
        if: steps.eks-check.outputs.exists == 'true'
        run: |
          kubectl delete namespace argocd --ignore-not-found=true --wait=true --timeout=300s

      - name: Remove ingress-nginx Helm release
        if: steps.eks-check.outputs.exists == 'true'
        run: |
          helm uninstall ingress-nginx \
            -n ingress-nginx \
            --ignore-not-found \
            --wait \
            --timeout 300s

      - name: Wait for ingress-nginx load balancer cleanup
        if: steps.eks-check.outputs.exists == 'true'
        run: |
          sleep 60s

      - name: Remove aws-load-balancer-controller Helm release
        if: steps.eks-check.outputs.exists == 'true'
        run: |
          helm uninstall aws-load-balancer-controller \
            -n kube-system \
            --ignore-not-found \
            --wait \
            --timeout 300s

      - name: Remove leftover Kubernetes security groups
        run: |
          VPC_ID=$(terraform output -raw vpc_id 2>/dev/null || true)

          if [ -z "$VPC_ID" ]; then
            echo "Terraform VPC output unavailable. Trying EKS cluster..."

            VPC_ID=$(aws eks describe-cluster \
              --name 2048-eks-cluster \
              --region eu-west-2 \
              --query "cluster.resourcesVpcConfig.vpcId" \
              --output text 2>/dev/null || true)
          fi

          if [ -z "$VPC_ID" ] || [ "$VPC_ID" = "None" ]; then
            echo "Could not determine VPC ID. Skipping Kubernetes security group cleanup."
            exit 0
          fi

          echo "Using VPC: $VPC_ID"

          for attempt in {1..10}; do
            SG_IDS=$(aws ec2 describe-security-groups \
              --filters \
                "Name=vpc-id,Values=$VPC_ID" \
                "Name=group-name,Values=k8s-*" \
              --query "SecurityGroups[*].GroupId" \
              --output text)

            if [ -z "$SG_IDS" ]; then
              echo "No leftover Kubernetes security groups found."
              exit 0
            fi

            echo "Found Kubernetes security groups: $SG_IDS"

            for SG_ID in $SG_IDS; do
              ENI_COUNT=$(aws ec2 describe-network-interfaces \
                --filters "Name=group-id,Values=$SG_ID" \
                --query "length(NetworkInterfaces)" \
                --output text)

              if [ "$ENI_COUNT" -eq 0 ]; then
                echo "Deleting security group: $SG_ID"
                aws ec2 delete-security-group \
                  --group-id "$SG_ID" || true
              else
                echo "$SG_ID is still attached to $ENI_COUNT network interface(s)."
              fi
            done

            echo "Waiting 30 seconds before checking again..."
            sleep 30
          done

          echo "Some Kubernetes security groups still remain after waiting."
          exit 1

      - name: Terraform plan for destroy
        run: terraform plan -destroy -out=destroy.tfplan

      - name: Terraform destroy
        run: terraform apply -auto-approve destroy.tfplan
