name: Terraform Workflow

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - "kubernetes/**"
      - "argocd/**"
      - "helm/**"
      - "scripts/**"
      - ".yamllint"
      - ".tflint.hcl"
      - ".github/workflows/terraform.yaml"

  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - "kubernetes/**"
      - "argocd/**"
      - "helm/**"
      - "scripts/**"
      - ".yamllint"
      - ".tflint.hcl"
      - ".github/workflows/terraform.yaml"

  workflow_dispatch:
    inputs:
      action:
        description: "Choose the Terraform action to perform"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ github.repository }}
  cancel-in-progress: false

jobs:
  terraform-checks:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Checkov Terraform Security Scan
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf  # v12.1347.0
        with:
          directory: terraform
          framework: terraform
          soft_fail: true

      - name: Checkov Kubernetes Security Scan
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf  # v12.1347.0
        with:
          directory: kubernetes
          framework: kubernetes
          soft_fail: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3.1.2

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337  # v6.3.2
        with:
          tflint_version: v0.65.0

      - name: Initialise TFLint
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Lint Terraform configuration
        run: bash ../scripts/terraform-lint.sh

      - name: Install and lint YAML files
        working-directory: .
        run: bash scripts/yaml-lint.sh

      - name: Terraform format
        run: terraform fmt -check -recursive

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.action == 'plan'
        run: terraform plan

  terraform-apply:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
    needs: terraform-checks
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    defaults:
      run:
        working-directory: terraform

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3.1.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

      - name: Update AWS Load Balancer Controller VPC ID in Git
        working-directory: .
        run: bash scripts/update-vpc-id.sh

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede  # v4.0.1

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4.3.1

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name 2048-eks-cluster --region eu-west-2

      - name: Verify EKS access
        run: |
          kubectl get nodes

      - name: Configure gp3 StorageClass
        run: kubectl apply -f ../kubernetes/storageclass-gp3.yaml

      - name: Create Grafana Kubernetes Secrets
        working-directory: .
        env:
          GRAFANA_GITHUB_CLIENT_ID: ${{ secrets.GRAFANA_GITHUB_CLIENT_ID }}
          GRAFANA_GITHUB_CLIENT_SECRET: ${{ secrets.GRAFANA_GITHUB_CLIENT_SECRET }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: bash scripts/grafana-secrets.sh

      - name: Install ArgoCD
        run: bash ../scripts/install-argocd.sh

      - name: Verify ArgoCD installation
        run: bash ../scripts/verify-argocd.sh

      - name: Install Metrics Server
        run: bash ../scripts/install-metrics-server.sh

      - name: Register ArgoCD Parent Application
        run: bash ../scripts/register-argocd-parent.sh

      - name: Wait for cert-manager
        run: bash ../scripts/wait-for-argocd-app-health.sh cert-manager

      - name: Wait for AWS Load Balancer Controller
        run: bash ../scripts/wait-for-argocd-app-health.sh aws-load-balancer-controller

      - name: Verify Prometheus Operator
        run: bash ../scripts/verify-prometheus-operator.sh

      - name: Verify ArgoCD Platform Applications
        run: bash ../scripts/verify-platform-applications.sh

      - name: Verify 2048 Application
        run: bash ../scripts/verify-2048-application.sh

  terraform-destroy:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
    needs: terraform-checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3.1.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede  # v4.0.1

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4.3.1

      - name: Terraform init
        run: terraform init

      - name: Check if EKS cluster exists
        id: eks-check
        run: bash ../scripts/check-eks-exists.sh

      - name: Configure kubectl
        if: steps.eks-check.outputs.exists == 'true'
        run: |
          aws eks update-kubeconfig --name 2048-eks-cluster --region eu-west-2

      - name: Ensure GitHub Actions EKS access
        if: steps.eks-check.outputs.exists == 'true'
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: bash ../scripts/ensure-eks-access.sh

      - name: Check if ArgoCD is installed
        id: argocd-check
        if: steps.eks-check.outputs.exists == 'true'
        run: bash ../scripts/check-argocd-exists.sh

      - name: Remove ArgoCD Parent Application
        if: steps.argocd-check.outputs.exists == 'true'
        run: bash ../scripts/remove-argocd-parent.sh

      - name: Remove Monitoring Application
        if: steps.argocd-check.outputs.exists == 'true'
        run: bash ../scripts/remove-monitoring.sh

      - name: Verify Grafana EBS Volume Cleanup
        if: steps.eks-check.outputs.exists == 'true'
        run: bash ../scripts/verify-grafana-ebs-cleanup.sh

      - name: Remove 2048 Application
        if: steps.argocd-check.outputs.exists == 'true'
        run: bash ../scripts/remove-2048-application.sh

      - name: Remove Traefik Application
        if: steps.argocd-check.outputs.exists == 'true'
        run: bash ../scripts/remove-traefik.sh

      - name: Wait for NLB deletion
        if: steps.eks-check.outputs.exists == 'true'
        run: bash ../scripts/wait-for-nlb-deletion.sh

      - name: Remove ExternalDNS Application
        if: steps.argocd-check.outputs.exists == 'true'
        run: bash ../scripts/remove-argocd-application.sh external-dns

      - name: Remove ClusterIssuer Application
        if: steps.argocd-check.outputs.exists == 'true'
        run: bash ../scripts/remove-argocd-application.sh cluster-issuer

      - name: Remove AWS Load Balancer Controller and cert-manager
        if: steps.argocd-check.outputs.exists == 'true'
        run: |
          set -e
          bash ../scripts/remove-argocd-application.sh aws-load-balancer-controller
          bash ../scripts/remove-argocd-application.sh cert-manager

      - name: Remove ArgoCD
        if: steps.eks-check.outputs.exists == 'true'
        run: bash ../scripts/remove-argocd.sh

      - name: Remove leftover Kubernetes security groups
        run: bash ../scripts/cleanup-security-groups.sh

      - name: Remove leftover Route 53 records
        run: bash ../scripts/cleanup-route53.sh

      - name: Terraform plan for destroy
        run: terraform plan -destroy -out=destroy.tfplan

      - name: Terraform destroy
        run: bash ../scripts/terraform-destroy.sh

      - name: Remove leftover EKS CloudWatch Logs
        run: bash ../scripts/cleanup-cloudwatch-logs.sh
