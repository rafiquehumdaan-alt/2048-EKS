name: Application Workflow

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/application.yaml"

  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/application.yaml"

  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        type: choice
        options:
          - deploy image
          - scan image

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t 2048:latest ./app

      - name: Scan image using Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 2048:latest
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      - name: Configure AWS Credentials
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy image')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Login to ECR repository
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy image')
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker image to ECR
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy image')
        run: |
          docker tag 2048:latest ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.eu-west-2.amazonaws.com/2048-eks-repo:${{ github.sha }}
          docker push ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.eu-west-2.amazonaws.com/2048-eks-repo:${{ github.sha }}

      - name: Update Kubernetes image tag
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy image')
        run: |
          sed -i \
            's|${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.eu-west-2.amazonaws.com/2048-eks-repo:[^"]*|${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.eu-west-2.amazonaws.com/2048-eks-repo:${{ github.sha }}|' \
            kubernetes/deployment.yaml

      - name: Commit Kubernetes image update
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy image')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kubernetes/deployment.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore: update 2048 image to ${{ github.sha }}"
          git push

      - name: Set up kubectl
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy image')
        uses: azure/setup-kubectl@v4

      - name: Configure kubectl
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy image')
        run: |
          aws eks update-kubeconfig \
            --name 2048-eks-cluster \
            --region eu-west-2

      - name: Verify 2048 deployment
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy image')
        run: |
          set -euo pipefail

          EXPECTED_IMAGE="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.eu-west-2.amazonaws.com/2048-eks-repo:${{ github.sha }}"

          echo "Waiting for ArgoCD to deploy $EXPECTED_IMAGE"

          for attempt in {1..60}; do
            CURRENT_IMAGE=$(kubectl get deployment 2048-deployment \
              -n 2048 \
              -o jsonpath='{.spec.template.spec.containers[0].image}')

            if [ "$CURRENT_IMAGE" = "$EXPECTED_IMAGE" ]; then
              echo "Expected image detected."
              break
            fi

            if [ "$attempt" -eq 60 ]; then
              echo "Timed out waiting for the updated image."
              exit 1
            fi

            sleep 10
          done

          kubectl rollout status deployment/2048-deployment \
            -n 2048 --timeout=300s

          kubectl wait \
            --for=jsonpath='{.status.sync.status}'=Synced \
            application/2048 -n argocd --timeout=300s

          kubectl wait \
            --for=jsonpath='{.status.health.status}'=Healthy \
            application/2048 -n argocd --timeout=300s

          echo "2048 deployment successful."
