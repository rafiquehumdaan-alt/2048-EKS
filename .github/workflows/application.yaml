name: Application Workflow

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "scripts/push-image-to-ecr.sh"
      - "scripts/update-app-image.sh"
      - "scripts/verify-app-deployment.sh"
      - ".github/workflows/application.yaml"

  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "scripts/push-image-to-ecr.sh"
      - "scripts/update-app-image.sh"
      - "scripts/verify-app-deployment.sh"
      - ".github/workflows/application.yaml"

  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        type: choice
        options:
          - deploy image
          - scan image

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build Docker image
        run: docker build -t 2048:latest ./app

      - name: Scan image using Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0
        with:
          image-ref: 2048:latest
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      - name: Configure AWS Credentials
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy image')
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Login to ECR repository
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy image')
        uses: aws-actions/amazon-ecr-login@aded0d722166a37980e030aa969dda0bfe6b6947  # v2.1.7

      - name: Push Docker image to ECR
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy image')
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: bash scripts/push-image-to-ecr.sh

      - name: Update and commit Kubernetes image
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy image')
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: bash scripts/update-app-image.sh

      - name: Set up kubectl
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy image')
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede  # v4.0.1

      - name: Configure kubectl
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy image')
        run: |
          aws eks update-kubeconfig --name 2048-eks-cluster --region eu-west-2

      - name: Verify 2048 deployment
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy image')
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: bash scripts/verify-app-deployment.sh
