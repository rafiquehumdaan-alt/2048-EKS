apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: cluster-issuer
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/rafiquehumdaan-alt/2048-EKS.git
    targetRevision: main
    path: platform

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  