apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: 2048
  namespace: argocd

namespace: argocd

spec:
  project: default

source:
  repoURL: "https://github.com/rafiquehumdaan-alt/2048-EKS.git"
  targetRevision: main
  path: kubernetes

  destination:
    server: "https://kubernetes.default.svc"
    namespace: "2048"

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
