apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: "2048"
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/rafiquehumdaan-alt/2048-EKS.git
    targetRevision: main
    path: kubernetes

  destination:
    server: https://kubernetes.default.svc
    namespace: "2048"

  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: 2048-deployment
      namespace: "2048"
      jsonPointers:
        - /spec/replicas

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
